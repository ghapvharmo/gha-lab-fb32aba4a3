name: <Native> Apply clang format

#on: [push, pull_request]
on:
  pull_request_target:
    types: [closed]
    paths:
    - 'templates/**'
    - 'native/**'

jobs:
  Clang-Format:
    timeout-minutes: 20
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@dc323e67f16fb5f7663d20ff7941f27f5809e9b6 # v2
      with:
        token: ${{ github.token }}
        ref: ${{ github.head_sha }}
    
    - id: get_change_files
      uses: fish9167/file-changes-action@96385226e7e8530961a9bfebcd319aa054e8012c # v1.2.3
      with:
        output: ' '
        fileOutput: ' '

    - name: Echo change files
      run: |
        cat $HOME/files.txt
        mv $HOME/files.txt ${{github.workspace}}/files.txt
    
    - uses: fish9167/clang-format-lint-action@07920064ee018558ac8300ea9f6b1874b8145ee9 # master
      with:
        source: ./native
        exclude: ./native/cocos/bindings/auto
        extensions: 'c,h,hpp,cpp,cxx'
        style: file
        inplace: True
        clangFormatVersion: 12

    - name: Create Pull Request 
      uses: fish9167/create-pull-request@052fc72b4198ba9fbc81b818c6e1859f747d49a8 # v3
      with:
          title: '[ci skip][AUTO]: Automated PR to fix formatting'
          body: |
            Automated PR to fix formatting
          committer: cocos-robot <cocos-robot@cocos.com>
          author: cocos-robot <cocos-robot@cocos.com>
          commit-message: "[ci skip][AUTO]: Automated clang-format update: ${{ github.event.pull_request.head.sha }}  (#${{ github.event.number }})"
          token: ${{ secrets.PR_TOKEN }}
          push-to-fork: cocos-robot/engine
          branch: t/bot/fix-format
          branch-suffix: short-commit-hash
          delete-branch: true
